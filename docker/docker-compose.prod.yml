# ============================================================
# Polymer Genomics API — Production Compose
# ============================================================
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# All secrets are supplied via environment variables or a
# secrets manager — no .env file is mounted into containers.
#
# MinIO is intentionally absent; production uses real S3.
# ============================================================

services:
  # --------------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polymer_genomics}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT_MAPPING:-127.0.0.1:5432:5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d polymer_genomics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    shm_size: 256mb

  # --------------------------------------------------------
  # Polymer Genomics API
  # --------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-polymer_genomics}
      POSTGRES_USER: ${API_DB_USER:-api_reader}
      POSTGRES_USER_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD}
      # S3 (real AWS — no endpoint override needed)
      S3_BUCKET: ${S3_BUCKET:-polymer-genomics-api}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Auth
      POLYMER_API_KEY: ${POLYMER_API_KEY:?Set POLYMER_API_KEY}
      # App tuning
      MAX_REGION_LENGTH: ${MAX_REGION_LENGTH:-10000000}
      MAX_RETURNED_ROWS: ${MAX_RETURNED_ROWS:-50000}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-1000}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
