[project]
name = "polymer-genomics"
version = "0.2.0"
description = "Python client for the Polymer Genomics API — DNA biophysical properties and curated genomic reference data"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Polymer Genomics", email = "hello@polymerbio.org" },
]
keywords = ["genomics", "biophysics", "dna", "methylation", "bioinformatics", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://polymerbio.org"
Documentation = "https://api.polymerbio.org/docs"
API = "https://api.polymerbio.org"
Issues = "https://github.com/polymerbio/polymer-genomics-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymer_genomics"]
