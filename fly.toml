# ──────────────────────────────────────────────────────────────────
# Polymer Genomics API — Fly.io deployment config
# ──────────────────────────────────────────────────────────────────
#
# Deploy:
#   fly launch            # first time (creates app + Postgres)
#   fly deploy            # subsequent deploys
#   fly secrets set POLYMER_API_KEY=$(openssl rand -hex 32)
#
# Postgres:
#   fly postgres create --name polymer-db
#   fly postgres attach polymer-db
#
# After Postgres is attached, run init.sql:
#   fly postgres connect -a polymer-db < docker/postgres/init.sql
#
# Data ingestion (run from a one-off machine):
#   fly machine run . --entrypoint "bash scripts/ingest_all.sh" --vm-size shared-cpu-4x

app = "polymer-genomics-api"
primary_region = "iad"

[build]

[deploy]
  release_command = "python -c \"import polymer_genomics; print('Import OK')\""

[processes]
  app = "uvicorn polymer_genomics.main:app --host 0.0.0.0 --port 8000 --workers 2 --log-level info"

[env]
  POLYMER_CORS_ORIGINS = "https://polymerbio.org,https://www.polymerbio.org,https://polymer-genomics.vercel.app,http://localhost:3000"
  FASTA_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/ping"
    port = 8000
    timeout = "5s"
    type = "http"

[mounts]
  source = "polymer_data"
  destination = "/data"
  initial_size = "10"
