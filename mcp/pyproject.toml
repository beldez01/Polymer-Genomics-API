[project]
name = "polymer-genomics-mcp"
version = "0.1.0"
description = "MCP server for the Polymer Genomics API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
polymer-genomics-mcp = "polymer_genomics_mcp.server:main"
