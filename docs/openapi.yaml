  /v1/evaluate:
    post:
      tags:
      - evaluate
      summary: Evaluate Design
      description: "Evaluate the biophysical properties of a DNA sequence.\n\nTakes\
        \ any DNA sequence (10\u2013100,000 bp) and returns a comprehensive\nbiophysical\
        \ assessment including thermodynamic stability, structural\nproperties, CpG\
        \ islands, and flagged regions of concern.\n\nThis is a **pure computation**\
        \ endpoint \u2014 no database or reference genome\nneeded. The sequence is\
        \ analyzed directly using published biophysical\nlookup tables (SantaLucia\
        \ 1998, Tataurov 2008, El Hassan & Calladine\n1996/1997, Ho 1986, Gardiner-Garden\
        \ & Frommer 1987).\n\n**Use cases:**\n- Evaluate a synthetic construct before\
        \ ordering synthesis\n- Flag CpG islands that may cause silencing in mammalian\
        \ cells\n- Assess thermodynamic stability uniformity across a construct\n\
        - Detect homopolymer runs and dinucleotide repeats (synthesis difficulty)\n\
        - Compare windowed GC and stacking energy profiles"
      operationId: evaluate_design_v1_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/compare:
    post:
      tags:
      - evaluate
      summary: Compare Sequences
      description: "Compare biophysical properties of multiple DNA sequences.\n\n\
        Accepts 2\u201310 named sequences and returns per-sequence evaluations plus\n\
        a delta table comparing each sequence against the first (reference).\n\n**Use\
        \ cases:**\n- Compare codon-optimized variants against wildtype\n- Evaluate\
        \ multiple promoter candidates side-by-side\n- Assess the biophysical impact\
        \ of mutations or redesigns"
      operationId: compare_sequences_v1_compare_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/evaluate/batch:
    post:
      tags:
      - evaluate
      summary: Batch Evaluate
      description: "Evaluate biophysical properties of up to 100 DNA sequences.\n\n\
        Returns per-sequence evaluation reports. Unlike /compare, this does NOT\n\
        compute deltas \u2014 it evaluates each sequence independently. Designed for\n\
        synthetic biology teams screening candidate libraries.\n\n**Use cases:**\n\
        - Screen a library of codon-optimized variants\n- Batch-evaluate promoter\
        \ candidates\n- Pre-screen synthesis orders for problematic sequences"
      operationId: batch_evaluate_v1_evaluate_batch_post
      requestBody:
        content:
          application/json:
