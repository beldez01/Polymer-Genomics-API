          default: dna_dna
          title: Duplex Type
        description: Duplex type for NN params (only 'dna_dna' for genomic DNA)
      - name: salt_mm
        in: query
        required: false
        schema:
          type: number
          description: NaCl concentration in mM (1000 = standard, 150 = physiological)
          default: 1000.0
          title: Salt Mm
        description: NaCl concentration in mM (1000 = standard, 150 = physiological)
      - name: properties
        in: query
        required: false
        schema:
          type: string
          description: 'Comma-separated: thermodynamics,extinction,groove,form_propensity
