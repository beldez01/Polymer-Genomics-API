components:
  schemas:
    BatchEvaluateRequest:
      properties:
        sequences:
          additionalProperties:
            type: string
          type: object
          maxProperties: 100
          minProperties: 1
          title: Sequences
          description: "Named sequences to evaluate. Keys are labels, values are DNA\
            \ sequences. 1\u2013100 sequences."
        analysis:
          type: string
          pattern: ^(full|thermodynamic|structural)$
          title: Analysis
          description: Analysis type.
          default: full
        salt_mm:
          type: number
          maximum: 5000.0
          minimum: 1.0
          title: Salt Mm
          description: NaCl concentration in mM.
          default: 1000.0
        window_size:
          type: integer
          maximum: 10000.0
          minimum: 20.0
          title: Window Size
          description: Window size in bp.
          default: 100
      type: object
      required:
      - sequences
      title: BatchEvaluateRequest
      description: Request body for batch sequence evaluation.
    CompareRequest:
      properties:
        sequences:
          additionalProperties:
            type: string
          type: object
          maxProperties: 10
          minProperties: 2
          title: Sequences
          description: "Named sequences to compare. Keys are labels, values are DNA\
            \ sequences. 2\u201310 sequences."
        analysis:
          type: string
          pattern: ^(full|thermodynamic|structural)$
          title: Analysis
          description: Analysis type.
          default: full
        salt_mm:
          type: number
          maximum: 5000.0
          minimum: 1.0
          title: Salt Mm
          description: NaCl concentration in mM.
          default: 1000.0
        window_size:
          type: integer
          maximum: 10000.0
          minimum: 20.0
          title: Window Size
          description: Window size in bp.
          default: 100
      type: object
      required:
      - sequences
      title: CompareRequest
      description: Request body for multi-sequence comparison.
    EvaluateRequest:
      properties:
        sequence:
          type: string
          maxLength: 100000
          minLength: 10
          title: Sequence
          description: "DNA sequence (ACGT, Ns tolerated). 10\u2013100,000 bp."
        name:
          type: string
          maxLength: 200
          title: Name
          description: Label for this sequence.
          default: unnamed
        analysis:
          type: string
          pattern: ^(full|thermodynamic|structural)$
          title: Analysis
          description: 'Analysis type: ''full'' (default), ''thermodynamic'', or ''structural''.'
          default: full
        salt_mm:
          type: number
          maximum: 5000.0
          minimum: 1.0
          title: Salt Mm
          description: NaCl concentration in mM. 1000 = standard (SantaLucia), 150
            = physiological.
          default: 1000.0
        window_size:
          type: integer
          maximum: 10000.0
          minimum: 20.0
          title: Window Size
          description: Window size in bp for windowed profiles (default 100).
          default: 100
      type: object
      required:
      - sequence
      title: EvaluateRequest
      description: Request body for sequence evaluation.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IntersectFilter:
      properties:
        layer:
          type: string
          title: Layer
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
        op:
          type: string
          title: Op
        value:
          anyOf:
          - type: number
          - type: string
          - items: {}
            type: array
          - type: 'null'
          title: Value
      type: object
      required:
      - layer
      - op
      title: IntersectFilter
    IntersectRequest:
      properties:
        build:
          type: string
          title: Build
          default: hg38
        region:
          type: string
          title: Region
        filters:
          items:
            $ref: '#/components/schemas/IntersectFilter'
          type: array
          maxItems: 10
          minItems: 1
          title: Filters
        return_layers:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Return Layers
        limit:
          type: integer
          maximum: 10000.0
          title: Limit
          default: 1000
      type: object
      required:
      - region
      - filters
      title: IntersectRequest
    ProbeBatchRequest:
      properties:
        probe_ids:
          items:
            type: string
          type: array
          title: Probe Ids
      type: object
      required:
      - probe_ids
      title: ProbeBatchRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
