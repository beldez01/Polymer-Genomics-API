openapi: 3.1.0
info:
  title: Polymer Genomics API
  description: Curated genomic reference database for agents and bioinformaticians
  version: 0.2.0
paths:
  /v1/aggregation/{build}/{region}:
    get:
      tags:
      - aggregation
      summary: Aggregate Region
      operationId: aggregate_region_v1_aggregation__build___region__get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: region
        in: path
        required: true
        schema:
          type: string
          title: Region
      - name: layers
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Layers
      - name: resolution
        in: query
        required: false
        schema:
          type: integer
          default: 1000
          title: Resolution
      - name: coords
        in: query
        required: false
        schema:
          type: string
          default: 1based
          title: Coords
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/bulk/{layer_key}:
    get:
      tags:
      - bulk
      summary: Bulk Download
      operationId: bulk_download_v1_bulk__layer_key__get
      parameters:
      - name: layer_key
        in: path
        required: true
        schema:
          type: string
          title: Layer Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/genes/{build}/{symbol}/expression:
    get:
      tags:
      - expression
      summary: Get Gene Expression
      operationId: get_gene_expression_v1_genes__build___symbol__expression_get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/genes/{build}/{symbol}/cost:
    get:
      tags:
      - gene_costs
      summary: Get Gene Cost
      operationId: get_gene_cost_v1_genes__build___symbol__cost_get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/genes/{build}/{symbol}:
    get:
      tags:
      - genes
      summary: Get Gene
      operationId: get_gene_v1_genes__build___symbol__get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/layers:
    get:
      tags:
      - layers
      summary: List Layers
      operationId: list_layers_v1_layers_get
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      - name: build
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Build
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Active
      - name: evidence_class
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Class
      - name: tier
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/layers/summary/{build}:
    get:
      tags:
      - layers
      summary: Layer Summary
      description: 'Genome-wide summary counts for key layers.


        Returns authoritative feature counts from the database, including

        protein-coding gene count (filtered from gene.features).'
      operationId: layer_summary_v1_layers_summary__build__get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/layers/{layer_key}:
    get:
      tags:
      - layers
      summary: Get Layer
      operationId: get_layer_v1_layers__layer_key__get
      parameters:
      - name: layer_key
        in: path
        required: true
        schema:
          type: string
          title: Layer Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/layers/{layer_key}/license:
    get:
      tags:
      - layers
      summary: Get Layer License
      description: 'Full license, citation, and provenance information for a data
        layer.


        Returns the source database, license terms, and citation information.

        Useful for NAR-style attribution and compliance auditing.'
      operationId: get_layer_license_v1_layers__layer_key__license_get
      parameters:
      - name: layer_key
        in: path
        required: true
        schema:
          type: string
          title: Layer Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/probes/{build}/{probe_id}:
    get:
      tags:
      - probes
      summary: Get Probe
      operationId: get_probe_v1_probes__build___probe_id__get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: probe_id
        in: path
        required: true
        schema:
          type: string
          title: Probe Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/probes/{build}/batch:
    post:
      tags:
      - probes
      summary: Probe Batch
      operationId: probe_batch_v1_probes__build__batch_post
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProbeBatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/query:
    get:
      tags:
      - proximity
      summary: Query Proximity
      operationId: query_proximity_v1_query_get
      parameters:
      - name: build
        in: query
        required: true
        schema:
          type: string
          title: Build
      - name: gene
        in: query
        required: true
        schema:
          type: string
          title: Gene
      - name: radius
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          title: Radius
      - name: layers
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Layers
      - name: coords
        in: query
        required: false
        schema:
          type: string
          default: 1based
          title: Coords
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/regions/{build}/{region}:
    get:
      tags:
      - regions
      summary: Query Region
      operationId: query_region_v1_regions__build___region__get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: region
        in: path
        required: true
        schema:
          type: string
          title: Region
      - name: layers
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Layers
      - name: fields
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Fields
      - name: coords
        in: query
        required: false
        schema:
          type: string
          default: 1based
          title: Coords
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/search:
    get:
      tags:
      - search
      summary: Search
      operationId: search_v1_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          title: Q
      - name: build
        in: query
        required: true
        schema:
          type: string
          title: Build
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sequence/{build}/{region}:
    get:
      tags:
      - sequence
      summary: Get Sequence Endpoint
      description: 'Return the raw DNA sequence for a genomic region.


        The response contains the uppercase nucleotide string plus metadata.

        Coordinates in the response always use 1-based closed convention,

        matching the user-facing format regardless of the ``coords`` query

        parameter used for input.'
      operationId: get_sequence_endpoint_v1_sequence__build___region__get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: region
        in: path
        required: true
        schema:
          type: string
          title: Region
      - name: coords
        in: query
        required: false
        schema:
          type: string
          default: 1based
          title: Coords
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tiles/{build}/{chr_name}/tile/{resolution}/{tile_index}:
    get:
      tags:
      - tiles
      summary: Get Tile
      operationId: get_tile_v1_tiles__build___chr_name__tile__resolution___tile_index__get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: chr_name
        in: path
        required: true
        schema:
          type: string
          title: Chr Name
      - name: resolution
        in: path
        required: true
        schema:
          type: integer
          title: Resolution
      - name: tile_index
        in: path
        required: true
        schema:
          type: integer
          title: Tile Index
      - name: layers
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Layers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/genes/{build}/{symbol}/protein-abundance:
    get:
      tags:
      - protein_abundance
      summary: Get Protein Abundance
      operationId: get_protein_abundance_v1_genes__build___symbol__protein_abundance_get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/genes/{build}/{symbol}/constraint:
    get:
      tags:
      - constraint
      summary: Get Gene Constraint
      operationId: get_gene_constraint_v1_genes__build___symbol__constraint_get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/genes/{build}/{symbol}/pathways:
    get:
      tags:
      - pathways
      summary: Get Gene Pathways
      operationId: get_gene_pathways_v1_genes__build___symbol__pathways_get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/genes/{build}/{symbol}/gene-sets:
    get:
      tags:
      - gene_sets
      summary: Get Gene Sets
      operationId: get_gene_sets_v1_genes__build___symbol__gene_sets_get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/genes/{build}/{symbol}/protein-atlas:
    get:
      tags:
      - protein_atlas
      summary: Get Protein Atlas
      operationId: get_protein_atlas_v1_genes__build___symbol__protein_atlas_get
      parameters:
      - name: build
        in: path
        required: true
        schema:
          type: string
          title: Build
      - name: symbol
        in: path
        required: true
        schema:
          type: string
          title: Symbol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/nn-parameters:
    get:
      tags:
      - reference
      summary: Get Nn Parameters
      description: "Return nearest-neighbor thermodynamic parameters.\n\n\u0394H (kcal/mol),\
        \ \u0394S (cal/mol\xB7K), \u0394G\u2083\u2087 (kcal/mol) per dinucleotide\
        \ step\nin 1 M NaCl at 37\xB0C."
      operationId: get_nn_parameters_v1_reference_nn_parameters_get
      parameters:
      - name: duplex_type
        in: query
        required: false
        schema:
          type: string
          description: '''dna_dna'', ''rna_rna'', or ''rna_dna'''
          default: dna_dna
          title: Duplex Type
        description: '''dna_dna'', ''rna_rna'', or ''rna_dna'''
      - name: dinucleotide
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Specific dinucleotide (e.g. 'CG')
          title: Dinucleotide
        description: Specific dinucleotide (e.g. 'CG')
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/dinucleotide-properties:
    get:
      tags:
      - reference
      summary: Get Dinucleotide Properties
      description: 'Return per-dinucleotide biophysical properties.


        Extinction coefficients (Tataurov 2008), A/Z-form propensity, and

        groove geometry per dinucleotide step.'
      operationId: get_dinucleotide_properties_v1_reference_dinucleotide_properties_get
      parameters:
      - name: dinucleotide
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Specific dinucleotide (e.g. 'CG')
          title: Dinucleotide
        description: Specific dinucleotide (e.g. 'CG')
      - name: property_set
        in: query
        required: false
        schema:
          type: string
          description: '''all'', ''extinction'', ''groove'', or ''form_propensity'''
          default: all
          title: Property Set
        description: '''all'', ''extinction'', ''groove'', or ''form_propensity'''
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/amino-acid-properties:
    get:
      tags:
      - reference
      summary: Get Amino Acid Properties
      description: 'Return amino acid biophysical reference properties.


        Molecular weight, volume (Zamyatnin), SASA, hydrophobicity (3 scales),

        pKa, and biosynthetic cost (Akashi-Gojobori) per residue.'
      operationId: get_amino_acid_properties_v1_reference_amino_acid_properties_get
      parameters:
      - name: residue
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: One-letter amino acid code (e.g. 'M')
          title: Residue
        description: One-letter amino acid code (e.g. 'M')
      - name: scale
        in: query
        required: false
        schema:
          type: string
          description: 'Hydrophobicity scale: ''kd'', ''ww'', ''eisenberg'', or ''all'''
          default: all
          title: Scale
        description: 'Hydrophobicity scale: ''kd'', ''ww'', ''eisenberg'', or ''all'''
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/physical-constants:
    get:
      tags:
      - reference
      summary: Get Physical Constants
      description: 'Return scalar biophysical constants.


        Persistence length, Manning parameters, elastic moduli, polymerase rates,

        ribosome speed, and other canonical values with units and provenance.'
      operationId: get_physical_constants_v1_reference_physical_constants_get
      parameters:
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Exact constant name (e.g. 'lp_bdna_physiological_nm')
          title: Name
        description: Exact constant name (e.g. 'lp_bdna_physiological_nm')
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by category (e.g. 'mechanics', 'kinetics')
          title: Category
        description: Filter by category (e.g. 'mechanics', 'kinetics')
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/sbs-spectrum:
    get:
      tags:
      - reference
      summary: Get Sbs Spectrum
      description: "Return SBS thermodynamic spectrum.\n\n96-channel COSMIC SBS trinucleotide\
        \ mutation spectrum with nearest-neighbor\nstacking energy perturbation (\u03B4\
        \u0394G) computed from SantaLucia 1998 parameters.\nPositive \u03B4\u0394\
        G = destabilizing mutation."
      operationId: get_sbs_spectrum_v1_reference_sbs_spectrum_get
      parameters:
      - name: mutation_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by mutation type (e.g. 'C>A')
          title: Mutation Type
        description: Filter by mutation type (e.g. 'C>A')
      - name: channel
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Specific SBS channel (e.g. 'A[C>A]G')
          title: Channel
        description: Specific SBS channel (e.g. 'A[C>A]G')
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/reference/clock-probes:
    get:
      tags:
      - reference
      summary: Get Clock Probes
      description: 'Return epigenetic clock probe coefficients.


        Query by clock name to get all probes for that clock, or by probe_id

        to see which clocks use that probe and its coefficient in each.

        Omit both to list all clocks with metadata.'
      operationId: get_clock_probes_v1_reference_clock_probes_get
      parameters:
      - name: clock
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Clock name (e.g. 'horvath_2013')
          title: Clock
        description: Clock name (e.g. 'horvath_2013')
      - name: probe_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Probe ID to check clock membership (e.g. 'cg16867657')
          title: Probe Id
        description: Probe ID to check clock membership (e.g. 'cg16867657')
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
