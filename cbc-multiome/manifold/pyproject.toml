[project]
name = "cbc-manifold"
version = "0.1.0"
description = "P0 data-pinned quasi-potential landscape (single-cell manifold pipeline)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "palantir>=1.3",
    "harmonypy>=0.0.9",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "numpy>=1.26,<2.1",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manifold"]
